name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-api:
    name: Deploy API (FastAPI Cloud)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Prepare monorepo packages for FastAPI Cloud
        working-directory: .
        run: bash scripts/prepare-fastapi-cloud.sh

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: uv sync

      - name: Deploy to FastAPI Cloud
        run: uv run fastapi cloud deploy --app-id "${{ secrets.FASTAPI_CLOUD_APP_ID }}"
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}

  deploy-web:
    name: Deploy frontend (Vercel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: apps/web
          vercel-args: "--prod"
