[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-domain"
version = "0.1.0"
description = "Domain enums, policies, and validation for Enterprise AI Support Agent"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_domain"]
