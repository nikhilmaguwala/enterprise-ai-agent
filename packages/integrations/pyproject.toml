[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-integrations"
version = "0.1.0"
description = "Typed HTTP clients for mock CRM/ERP/carrier/ticketing"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.0",
  "tenacity>=8.0",
  "enterprise-domain",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_integrations"]
