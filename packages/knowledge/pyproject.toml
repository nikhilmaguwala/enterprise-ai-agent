[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-knowledge"
version = "0.1.0"
description = "Chunking, embeddings, and hybrid retrieval"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0",
  "qdrant-client>=1.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_knowledge"]
